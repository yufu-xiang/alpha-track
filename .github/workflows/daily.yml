name: 每日資料更新

on:
  schedule:
    # 台北時間 18:00(UTC 10:00),收盤後兩小時,留給交易所結算時間
    - cron: "0 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # 兩個 run 同時寫同一個 SQLite 檔與同一個 branch 只會互相踩踏。
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 刻意不跟本機的 Python 版本一致。2026-08-25 的首班排程就是靠這個
      # 落差抓到一個 bug:某個 TLS 測試斷言 ssl 的預設含 VERIFY_X509_STRICT,
      # 但那個旗標 3.14 有、3.12 沒有 —— 本機全綠而 CI 整批失敗。
      # 對齊版本只會讓這種假設繼續藏著。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 沒有 ./ 的話 pip 會把 pipeline 當成 PyPI 上的套件名而不是本地路徑
      - name: 安裝相依套件
        run: pip install -e "./pipeline[dev]"

      - name: 執行測試
        run: cd pipeline && pytest -q

      # 鍵**必須每次都不同**,而由 restore-keys 做前綴回退。
      #
      # 這裡原本用固定鍵 alpha-track-db-v1,理由寫著「鍵必須穩定才會命中」。
      # 那個理由是錯的,而且錯得很安靜:actions/cache 在**命中時不會再存檔**,
      # 所以固定鍵的快取只會是第一次存下的那一份,之後每天還原它、更新它、
      # 然後丟掉。隔天再還原同一份舊的。
      #
      # 對「每天重抓就好」的資料(價格、配息)這只是浪費;但對**沒有歷史的
      # 來源**是致命的:折溢價的淨值只有當日快照、抓不到過去,
      # navs 表因此每天被打回原點,規格 §4.4 要的 20 個交易日樣本永遠湊不滿,
      # 而畫面上只會顯示「目前累積 1 個交易日」—— 看起來像功能剛上線,
      # 不像壞掉。
      #
      # 唯一鍵保證每次都是 miss,post 步驟因此一定存檔;restore-keys 以前綴
      # 找到最近一次的快取來還原。快取真的遺失仍是可自癒的 ——
      # update 會偵測缺歷史並回補,只有淨值補不回來。
      #
      # restore-keys 保留舊的 v1 是為了讓**第一次** v2 執行不必從零重建
      # (完整回補要十分鐘,而且會白白丟掉已累積的淨值)。
      # v2 存過一次之後這一行就沒有作用了,可以刪。
      - name: 還原資料庫快取
        uses: actions/cache@v4
        with:
          path: data/alpha_track.db
          key: alpha-track-db-v2-${{ github.run_id }}
          restore-keys: |
            alpha-track-db-v2-
            alpha-track-db-v1

      - name: 更新資料
        run: python -m alpha_track.cli update
        env:
          PYTHONPATH: pipeline/src

      # 這一步跑在數分鐘的回補之後,期間任何一次人工推送都會讓遠端前進,
      # 於是 push 被拒、整批白做 —— 而它已經付出完整回補的代價。
      # 2026-08-26 的執行就是這樣失敗的。
      #
      # rebase 是安全的:本工作只動 web/public/data/ 底下的產出檔,
      # 與人工變更不會改到同一行。真的衝突就讓它失敗,不要 -X ours 硬吃掉。
      - name: 提交更新的 JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/data/
          git diff --staged --quiet && echo "資料無變化,略過" && exit 0
          git commit -m "chore: 每日資料更新 $(date +%F)"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "推送被拒(第 $attempt 次),取回遠端後 rebase 重試"
            git pull --rebase origin main
          done
          echo "重試三次仍無法推送" >&2
          exit 1
