name: 部署網站

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      # web/** 同時涵蓋原始碼與 web/public/data/ 下的 JSON。
      # 後者是 daily.yml 每日提交的資料檔。
      - 'web/**'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # 資料更新與程式碼變更可能前後腳推上來,兩個部署同時跑會互相覆蓋。
  group: deploy-web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 每日更新是在觸發本 workflow 之後才提交 JSON，必須取 main 的最新版本。
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安裝相依套件
        run: npm ci
        working-directory: web

      - name: 執行測試
        run: npm test
        working-directory: web

      - name: 驗證匯出 JSON 契約
        run: npm run validate:data
        working-directory: web

      - name: 建置
        run: npm run build
        working-directory: web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
