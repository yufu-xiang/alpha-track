[project]
name = "alpha-track"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "certifi",
    "httpx>=0.27",
    "pandas>=2.2",
    "PyYAML>=6.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alpha_track"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
